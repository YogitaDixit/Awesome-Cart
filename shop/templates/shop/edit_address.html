{% extends 'shop/basic.html' %}

{% block title %}
Edit Address
{% endblock %}

{% block body %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-header bg-warning text-dark">

                    <h3 class="mb-0">Edit Address</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="form-group">

                            <label>Address Title</label>

                            <input
                                type="text"
                                class="form-control"
                                name="address_title"
                                value="{{ address.address_title }}"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Full Name</label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                value="{{ address.full_name }}"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Phone Number</label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                value="{{ address.phone }}"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Address Line 1</label>

                            <input
                                type="text"
                                class="form-control"
                                name="address_line1"
                                value="{{ address.address_line1 }}"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Address Line 2</label>

                            <input
                                type="text"
                                class="form-control"
                                name="address_line2"
                                value="{{ address.address_line2 }}"
                            >

                        </div>

                        <div class="form-row">

                            <div class="form-group col-md-4">

                                <label>City</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="city"
                                    value="{{ address.city }}"
                                    required
                                >

                            </div>

                            <div class="form-group col-md-4">

                                <label>State</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="state"
                                    value="{{ address.state }}"
                                    required
                                >

                            </div>

                            <div class="form-group col-md-4">

                                <label>PIN Code</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="zip_code"
                                    value="{{ address.zip_code }}"
                                    required
                                >

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success">

                            Update Address

                        </button>

                        <a
                            href="/shop/addresses/"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
