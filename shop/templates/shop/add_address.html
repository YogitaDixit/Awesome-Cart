{% extends 'shop/basic.html' %}

{% block title %}
Add New Address
{% endblock %}

{% block body %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">Add New Address</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="form-group">

                            <label>Address Title</label>

                            <input
                                type="text"
                                class="form-control"
                                name="address_title"
                                placeholder="Home / Office / Hostel"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Full Name</label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Phone Number</label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Address Line 1</label>

                            <input
                                type="text"
                                class="form-control"
                                name="address_line1"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>Address Line 2</label>

                            <input
                                type="text"
                                class="form-control"
                                name="address_line2"
                            >

                        </div>

                        <div class="form-row">

                            <div class="form-group col-md-4">

                                <label>City</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="city"
                                    required
                                >

                            </div>

                            <div class="form-group col-md-4">

                                <label>State</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="state"
                                    required
                                >

                            </div>

                            <div class="form-group col-md-4">

                                <label>PIN Code</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="zip_code"
                                    required
                                >

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Save Address
                        </button>

                        <a
                            href="/shop/checkout/"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
