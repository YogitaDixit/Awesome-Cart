{% extends 'shop/basic.html' %}
{% block title %}Sign In - My Awesome Cart{% endblock %}

{% block body %}
<div class="container my-5" style="max-width: 500px;">
    <h2>Sign In</h2>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn text-white btn-block" style="background-color: #ff6600;">Sign In</button>
    </form>
    <p class="mt-3">New to the site? <a href="{% url 'signup' %}">Sign Up here</a></p>
</div>
{% endblock %}
