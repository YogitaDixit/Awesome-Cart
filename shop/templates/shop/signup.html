{% extends 'shop/basic.html' %}
{% block title %}Sign Up - My Awesome Cart{% endblock %}

{% block body %}
<div class="container my-5" style="max-width: 500px;">
    <h2>Create an Account</h2>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn text-white btn-block" style="background-color: #ff6600;">Sign Up</button>
    </form>
    <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Sign In here</a></p>
</div>
{% endblock %}
